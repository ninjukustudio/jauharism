<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching stone-900 / dark theme -->
    <linearGradient id="emblemBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24201d" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>

    <!-- Gold Gradients for Gem & Astrolabe -->
    <linearGradient id="emblemGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    
    <linearGradient id="emblemGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF8DC" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="emblemGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" fill="url(#emblemBgGrad)" />

  <!-- Decorative Astrolabe Background Circles -->
  <circle cx="160" cy="160" r="87.5" fill="none" stroke="#D4AF37" stroke-width="0.75" opacity="0.25" stroke-dasharray="4 4" />
  <circle cx="160" cy="160" r="102.5" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2" />
  <line x1="72.5" y1="160" x2="247.5" y2="160" stroke="#D4AF37" stroke-width="0.5" opacity="0.25" />
  <line x1="160" y1="72.5" x2="160" y2="247.5" stroke="#D4AF37" stroke-width="0.5" opacity="0.25" />

  <!-- LOGO MARK: Heptagonal Faceted Gem & Center Point -->
  <g transform="translate(160, 160) scale(0.8) scale(1, -1)" filter="url(#emblemGoldGlow)">
    <!-- Outer Layer / Peeled Accident (Heptagon) -->
    <polygon points="0,-100 78,-62 97,22 43,90 -43,90 -97,22 -78,-62" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="1.5" opacity="0.5" stroke-dasharray="12 6" />

    <!-- Secondary Structural Framework (Heptagon) -->
    <polygon points="0,-75 58,-46 72,17 32,68 -32,68 -72,17 -58,-46" fill="#1c1917" stroke="url(#emblemGoldLight)" stroke-width="2" opacity="0.9" />

    <!-- Inner Core Faceted Gem (Jawhar - Heptagon) -->
    <polygon points="0,-45 35,-28 43,10 19,41 -19,41 -43,10 -35,-28" fill="url(#emblemGoldGrad)" opacity="0.35" />

    <!-- Heptagonal Star / Facet Cut Lines to Center -->
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#F3E5AB" stroke-width="1.5" opacity="0.85" />
    <line x1="0" y1="0" x2="35" y2="-28" stroke="#F3E5AB" stroke-width="1.5" opacity="0.85" />
    <line x1="0" y1="0" x2="43" y2="10" stroke="#F3E5AB" stroke-width="1.5" opacity="0.85" />
    <line x1="0" y1="0" x2="19" y2="41" stroke="#F3E5AB" stroke-width="1.5" opacity="0.85" />
    <line x1="0" y1="0" x2="-19" y2="41" stroke="#F3E5AB" stroke-width="1.5" opacity="0.85" />
    <line x1="0" y1="0" x2="-43" y2="10" stroke="#F3E5AB" stroke-width="1.5" opacity="0.85" />
    <line x1="0" y1="0" x2="-35" y2="-28" stroke="#F3E5AB" stroke-width="1.5" opacity="0.85" />

    <!-- Center Point: The Absolute Axis of Tawhid -->
    <circle cx="0" cy="0" r="5" fill="#F8F9FA" />
    <circle cx="0" cy="0" r="2" fill="#1c1917" />
  </g>
</svg>
